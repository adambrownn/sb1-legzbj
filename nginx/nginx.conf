user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend servers
    upstream booking_backend {
        least_conn; # Use least connections algorithm
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=2r/s;

    # Cache zones
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=availability_cache:10m max_size=10g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name booking.example.com;

        # SSL configuration (uncomment for production)
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/ssl/booking.crt;
        # ssl_certificate_key /etc/nginx/ssl/booking.key;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Root location
        location / {
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Basic rate limiting
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Availability endpoint with caching
        location /api/availability {
            proxy_pass http://booking_backend;
            proxy_cache availability_cache;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 5m;
            proxy_cache_key $request_uri;
            add_header X-Cache-Status $upstream_cache_status;

            # Rate limiting for availability checks
            limit_req zone=api_limit burst=50 nodelay;
        }

        # Booking endpoints with stricter rate limiting
        location ~ ^/api/bookings {
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Stricter rate limiting for booking operations
            limit_req zone=booking_limit burst=5 nodelay;

            # Don't cache booking operations
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"UP"}';
        }

        # Static files with aggressive caching
        location /static/ {
            root /var/www;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
